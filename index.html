<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>打卡</title>
<meta name="theme-color" content="#f7f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="打卡">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
  :root {
    --bg: #f5f6f8;
    --text: #1f2329;
    --muted: #8a8f98;
    --primary: #4f6ef7;
    --green: #16a34a;
    --red: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-y: scroll; scrollbar-gutter: stable; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  body { background:#f7f6f3; }
  .app { min-height:100vh; display:flex; max-width:none; margin:0; padding:0; }
  .sidebar { width:220px; flex:0 0 220px; background:#fff; border-right:1px solid #e5e3df; padding:14px 10px; display:flex; flex-direction:column; }
  .side-nav { display:flex; flex-direction:column; gap:4px; }
  .side-link { display:flex; align-items:center; gap:12px; border:0; border-radius:10px; padding:13px 14px; background:transparent; text-align:left; font-family:inherit; font-size:15px; font-weight:500; color:var(--text); cursor:pointer; }
  .side-link.active,.side-link:hover { background:#e9e7f8; color:#5b55a1; }
  .side-link .icon { width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; color:currentColor; flex-shrink:0; }
  .side-link .icon svg { width:19px; height:19px; display:block; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .side-spacer { flex:1; }
  .main-content { flex:1; min-width:0; padding:24px 32px 40px; }
  .main-content > div:not(#home) { width:100%; max-width:900px; margin:0 auto; }
  .home-title { margin-bottom:18px; }
  @media(max-width:700px) { .sidebar { width:64px; flex-basis:64px; padding:10px 6px; } .side-link { justify-content:center; padding:12px 6px; } .side-label { display:none; } .main-content { padding:18px 12px 30px; } }

  .topbar { display: flex; align-items: center; gap: 10px; padding: 4px 0 18px; }
  .back-btn {
    width: 38px; height: 38px; border-radius: 12px; border: 1px solid #e8eaed;
    background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--text);
  }
  .topbar h1 { font-size: 18px; font-weight: 700; }
  .topbar .spacer { flex: 1; }

  .home-title { font-size: 22px; font-weight: 700; padding: 6px 4px 4px; }
  .menu { display: flex; flex-direction: column; margin-top: 4px; }
  .menu-card {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 6px; cursor: pointer;
    background: transparent; border: none; border-bottom: 1px solid #eef0f3;
    transition: .15s; text-align: left;
  }
  .menu-card:last-child { border-bottom: none; }
  .menu-card:active { background: #eceef2; }
  .menu-card .icon { font-size: 22px; line-height: 1; width: 34px; text-align: center; flex-shrink: 0; }
  .menu-card h2 { font-size: 16px; font-weight: 600; }
  .menu-card .arrow { margin-left: auto; color: #c3c7cf; font-size: 18px; }
  /* 操作说明卡片：不可点击，弱化样式 */
  .guide-card { cursor: default; }
  .guide-card:hover { transform: none; box-shadow: none; }
  .guide-card .guide-text {
    margin-top: 8px; font-size: 13px; color: var(--muted); line-height: 1.7;
  }

  .board-wrap { width: 100%; max-width: 420px; margin: 0 auto; }
  .board {
    position: relative; width: 100%; aspect-ratio: 8/12; background: #fff;
    border-radius: 20px; box-shadow: 0 2px 8px rgba(16,24,40,.08); overflow: hidden;
    border: 1px solid #e8eaed;
    background-image: none;
  }
  .board.pressing { box-shadow: inset 0 0 0 3px var(--primary), 0 2px 8px rgba(16,24,40,.08); }
  .board-hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #b7bbc3; font-size: 14px; pointer-events: none; text-align: center; line-height: 2; z-index: 0;
  }

  .tile {
    position: absolute; top: 0; left: 0; border-radius: 10px; cursor: pointer;
    display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; overflow: hidden;
    box-shadow: 0 1px 4px rgba(16,24,40,.10);
    transition: width .22s ease, height .22s ease, opacity .24s ease, filter .24s ease, box-shadow .24s ease;
    will-change: transform;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  .tile .tile-text {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 300; text-align: center; line-height: 1.35;
    padding: 2px 6px 6px; word-break: break-all; pointer-events: none; max-width: 100%;
  }
  .tile .tile-check {
    position: absolute; bottom: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800;
    color: #fff; background: var(--green);
    opacity:0; transform:scale(.65); transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.25,1);
  }
  .tile.done { opacity: .55; filter: saturate(.6); }
  .tile.done .tile-check { opacity:1; transform:scale(1); }
  .tile.balloon { box-shadow: 0 3px 10px rgba(16,24,40,.14); }
  /* 时间签：块内第一行，占据真实空间，文字排在下方，结构上不重叠 */
  .tile .tile-time {
    align-self: flex-end; margin: 4px 6px 0; font-size: 10px; font-weight: 400;
    color: #454b55; background: rgba(20,28,45,.06); padding: 2px 6px;
    border-radius: 6px; line-height: 1; pointer-events: none; z-index: 2; flex-shrink: 0;
  }

  .tile.c0,.tile.c1,.tile.c2,.tile.c3,.tile.c4,.tile.c5,.tile.c6,.tile.c7 { background:#fff; color:#252a32; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; padding: 24px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .dialog {
    background: #fff; border-radius: 18px; padding: 22px; width: 100%; max-width: 340px;
    box-shadow: 0 12px 40px rgba(16,24,40,.25);
  }
  .dialog h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .dialog input, .dialog textarea {
    width: 100%; border: 1px solid #e8eaed; border-radius: 12px; padding: 12px 14px;
    font-size: 15px; outline: none; background: #fafbfc; font-family: inherit;
    user-select: text; -webkit-user-select: text;
  }
  .dialog input:focus, .dialog textarea:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px #eef1fe; }
  .dialog textarea {
    resize: vertical; min-height: 76px; max-height: 220px; line-height: 1.5;
  }

  /* 简洁的可选小时/分钟输入 */
  .time-picker {
    display: flex; align-items: center; justify-content: flex-start; gap: 7px;
    min-height: 40px; position: relative; user-select: none; -webkit-user-select: none;
    background: transparent; border: 0; padding: 0; margin-top: 10px;
  }
  .time-label { margin-right:auto; color:#83899a; font-size:12px; white-space:nowrap; }
  .tp-inp {
    width: 66px; height: 40px; box-sizing:border-box; text-align: left;
    font-size: 12px; font-weight: 400; color: var(--text); padding:0 9px;
    border: 1px solid #e5e7ef; border-radius: 8px; background: #fff;
    -webkit-appearance: none; appearance: none; outline: none;
  }
  .tp-inp:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,.12); }
  .tp-inp::placeholder { color: #c4c8d0; font-weight: 400; }
  .tp-colon { font-size:14px; font-weight:400; color:#a1a5b1; display:flex; align-items:center; justify-content:center; }

  .dur-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 8px; }
  .opt-hint { font-weight: 400; font-size: 12px; color: #b7bbc3; }
  .dur-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .dur-btn {
    padding: 8px 12px; border-radius: 10px; border: 1px solid #e8eaed;
    background: #fafbfc; color: var(--text); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: .15s;
  }
  .dur-btn:hover { background: #f0f1f4; }
  .dur-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .dialog-btns { display: flex; gap: 10px; margin-top: 16px; }
  .dialog-btns button {
    flex: 1; padding: 11px; border-radius: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; border: none; font-family: inherit;
  }
  .btn-cancel { background: #f0f1f4; color: var(--text); }
  .btn-ok { background: var(--primary); color: #fff; }

  /* 多字段表单弹窗 */
  .form-field { margin-bottom: 12px; }
  .form-field:last-of-type { margin-bottom: 0; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .form-field input, .form-field textarea {
    width: 100%; border: 1px solid #e8eaed; border-radius: 12px; padding: 11px 13px;
    font-size: 15px; outline: none; background: #fafbfc; font-family: inherit;
    user-select: text; -webkit-user-select: text; box-sizing: border-box;
  }
  .form-field input:focus, .form-field textarea:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px #eef1fe; }

  .menu-pop {
    position: fixed; z-index: 200; background: #fff; border-radius: 16px;
    box-shadow: 0 12px 40px rgba(16,24,40,.28); padding: 6px; min-width: 160px;
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .menu-pop.show { opacity: 1; pointer-events: auto; }
  .menu-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 12px 14px; border: none; background: none; cursor: pointer;
    font-size: 15px; color: var(--text); border-radius: 10px; text-align: left; font-family: inherit;
  }
  .menu-item:hover { background: #f0f1f4; }
  .menu-item.danger { color: var(--red); }
  .menu-item.danger:hover { background: #feecec; }
  /* 菜单内的难度档位 + 时序开关 */
  .menu-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; gap: 8px;
  }
  .menu-row .mr-label { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .menu-levels { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .menu-level {
    padding: 4px 8px; border-radius: 7px; border: 1px solid #e8eaed;
    background: #fafbfc; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .menu-level.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .menu-switch {
    position: relative; width: 40px; height: 22px; border-radius: 11px;
    background: #d0d3da; cursor: pointer; transition: .2s; flex-shrink: 0;
  }
  .menu-switch.on { background: var(--primary); }
  .menu-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: .2s;
  }
  .menu-switch.on::after { left: 20px; }
  .menu-item .mi { font-size: 17px; }

  .hidden { display: none !important; }
  /* ===== 日历待办 ===== */
  .cal-wrap { width: 100%; max-width: 460px; margin: 0 auto; padding: 8px 12px 24px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-title { font-size: 17px; font-weight: 700; }
  .cal-nav {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid #e8eaed;
    background: #fff; font-size: 20px; cursor: pointer; color: var(--text); line-height: 1;
  }
  .cal-nav:hover { background: #f0f1f4; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .cal-weekdays span { padding: 4px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell {
    aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 10px; cursor: pointer; font-size: 14px; position: relative; color: var(--text);
  }
  .cal-day-number { font-size: 14px; line-height: 1.25; }
  .cal-day-note { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; line-height: 1.25; font-weight: 400; color: #9299a8; }
  .cal-day-note.special { color: #777fd2; }
  .cal-cell.has-task .cal-day-note, .cal-cell.all-done .cal-day-note { color: inherit; opacity: .78; }
  .cal-cell.other .cal-day-number, .cal-cell.other .cal-day-note { color: #c4c8d0; }
  .cal-cell.other { color: #c4c8d0; }
  .cal-cell:hover { background: #f0f1f4; }
  .cal-cell.today { background: #dfe3f3; color: #4a5580; font-weight: 700; }
  .cal-cell.sel { outline: 2px solid #a8aebf; outline-offset: -2px; }
  /* 有待办未完成：暖杏色；待办全部完成：抹茶绿；低饱和柔和色调 */
  .cal-cell.has-task {
    font-weight: 700; color: #92580f;
    background: #f7ddb7;
  }
  .cal-cell.has-task:hover { background: #f0d0a0; }
  .cal-cell.all-done {
    font-weight: 700; color: #43694a;
    background: #cde9cf;
  }
  .cal-cell.all-done:hover { background: #bfe0c2; }
  .cal-cell.has-task.today { background: #f7ddb7; }
  .cal-cell.all-done.today { background: #cde9cf; }
  .cal-list { margin-top: 16px; }
  .cal-list-title { font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .cal-items { display: flex; flex-direction: column; gap: 8px; }
  .cal-item {
    display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 12px;
    padding: 12px 14px; box-shadow: 0 1px 4px rgba(16,24,40,.08); border: 1px solid #e8eaed;
  }
  .cal-item .ci-check {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid #d0d3da;
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff;
  }
  .cal-item.done .ci-check { background: var(--green); border-color: var(--green); }
  .cal-item .ci-text { flex: 1; font-size: 14px; word-break: break-all; }
  .cal-item.done .ci-text { text-decoration: line-through; color: var(--muted); }
  .cal-item .ci-time { font-size: 12px; color: var(--muted); }
  .cal-item .ci-del { border: none; background: none; color: #c4c8d0; font-size: 18px; cursor: pointer; padding: 0 2px; }
  .cal-item .ci-del:hover { color: #e5484d; }
  .cal-add {
    width: 100%; margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px dashed #c4c8d0;
    background: #fafbfc; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .cal-add:hover { background: #f0f1f4; color: var(--text); }
  .cal-empty { text-align: center; color: #c4c8d0; font-size: 13px; padding: 16px 0; }

  /* ===== 我的 ===== */
  .mine-wrap { width: 100%; max-width: 460px; margin: 0 auto; padding: 8px 12px 24px; }
  .mine-profile { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 18px; padding: 20px; border: 1px solid #e8eaed; box-shadow: 0 1px 4px rgba(16,24,40,.06); }
  .mine-avatar { width: 56px; height: 56px; border-radius: 50%; background: #eef1fe; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .mine-name { font-size: 17px; font-weight: 700; }
  .mine-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .mine-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .stat-box { background: #fff; border-radius: 14px; padding: 16px 8px; text-align: center; border: 1px solid #e8eaed; box-shadow: 0 1px 4px rgba(16,24,40,.06); }
  .stat-num { font-size: 24px; font-weight: 800; color: var(--primary); }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .mine-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .mine-btn { padding: 14px; border-radius: 14px; border: 1px solid #e8eaed; background: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; color: var(--text); }
  .mine-btn:hover { background: #f0f1f4; }
  .mine-btn.danger { color: var(--red); }
  .mine-btn.danger:hover { background: #feecec; }

  /* ===== 记账 ===== */
  .bill-wrap { width: 100%; max-width: 460px; margin: 0 auto; padding: 8px 12px 24px; }
  /* 年份/月份 + 汇总 合并为一行（扁平） */
  .bill-head {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px;
  }
  .bill-head .cal-nav { width: 26px; height: 26px; border-radius: 8px; font-size: 13px; color: var(--muted); border: none; background: none; padding: 0; }
  .bill-head .cal-nav:hover { background: #f0f1f4; }
  .bill-head .cal-title { min-width: 64px; text-align: center; font-size: 14px; font-weight: 600; color: var(--muted); }
  .bill-head-sum { display: flex; align-items: baseline; gap: 8px; margin-left: 10px; }
  .bill-head-sum .hs-amt { font-size: 14px; font-weight: 400; }
  .bill-head-sum .hs-amt.income { color: #4f9568; font-weight:400; }
  .bill-head-sum .hs-amt.expense { color: #cf6266; font-weight:400; }
  .bill-head-sum .hs-sub { font-size: 12px; color: var(--muted); }
  .bill-card {
    background: #fff; border-radius: 14px; box-shadow: none; border: 1px solid #f0f1f4;
    padding: 4px 16px;
  }
  /* 行式账目：名称左、金额右（参照截图简洁格式） */
  .bill-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid #f0f1f4; font-size: 15px;
  }
  .bill-row:last-child { border-bottom: none; }
  .bill-row .br-name { flex: 1; min-width: 0; word-break: break-all; color: var(--text); }
  .bill-row .br-name .br-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .bill-row .br-amt { font-size: 14px; white-space: nowrap; color: var(--text); }
  .bill-row .br-amt.income { color: #16a34a; }
  .bill-row .br-amt.expense { color: #e5484d; }
  .bill-row .br-del { border: none; background: none; color: #c4c8d0; font-size: 17px; cursor: pointer; padding: 0 2px; }
  .bill-row .br-del:hover { color: #e5484d; }
  .bill-row.month-row { cursor: pointer; }
  .bill-row.month-row:hover { background: #fafbfc; }
  .bill-empty { text-align: center; color: #c4c8d0; font-size: 13px; padding: 24px 0; }
  .bill-add {
    width: 100%; margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px dashed #c4c8d0;
    background: #fafbfc; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .bill-add:hover { background: #f0f1f4; color: var(--text); }
  .bill-fixed-hint { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
  .bill-sub-tabs { margin-bottom: 12px; }
  .bill-sub-tabs .vt-btn { flex: 1; text-align: center; }
  .bill-empty { text-align: center; color: #c4c8d0; font-size: 13px; padding: 24px 0; }

  /* ===== 密码记录 ===== */
  .pwd-wrap { width: 100%; max-width: 460px; margin: 0 auto; padding: 8px 12px 24px; }
  .pwd-hint { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
  .pwd-items { display: flex; flex-direction: column; gap: 10px; }
  .pwd-item {
    background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(16,24,40,.08);
    border: 1px solid #e8eaed;
  }
  .pwd-item .pi-top { display: flex; align-items: center; gap: 10px; }
  .pwd-item .pi-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; background: #eef1fe; }
  .pwd-item .pi-title { flex: 1; min-width: 0; }
  .pwd-item .pi-name { font-size: 15px; font-weight: 700; word-break: break-all; }
  .pwd-item .pi-account { font-size: 12px; color: var(--muted); margin-top: 2px; word-break: break-all; }

<script>
// 同一浏览器只保留一个可操作实例；第二个标签页显示提示并停用交互。
const APP_INSTANCE_ID = (Date.now() + Math.random()).toString(36);
let APP_DUPLICATE_INSTANCE = false;
function showDuplicateInstanceNotice() {
  if (APP_DUPLICATE_INSTANCE) return;
  APP_DUPLICATE_INSTANCE = true;
  const lock = document.createElement('div');
  lock.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(247,246,243,.97);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:16px sans-serif;color:#1f2329;';
  lock.textContent = '打卡工具已在另一个页面打开，请切换到已打开的页面继续使用。';
  document.body.appendChild(lock);
}
// localStorage 可用时做第二层实例锁，覆盖不支持 BroadcastChannel 的本地预览。
const APP_LOCK_KEY = 'checkin_app_instance_lock_v1';
try {
  const oldLock = JSON.parse(localStorage.getItem(APP_LOCK_KEY) || 'null');
  if (oldLock && oldLock.id !== APP_INSTANCE_ID && Date.now() - oldLock.time < 10000) showDuplicateInstanceNotice();
  else localStorage.setItem(APP_LOCK_KEY, JSON.stringify({ id:APP_INSTANCE_ID, time:Date.now() }));
  setInterval(() => {
    const currentLock = JSON.parse(localStorage.getItem(APP_LOCK_KEY) || 'null');
    if (currentLock && currentLock.id !== APP_INSTANCE_ID && Date.now() - currentLock.time < 10000) showDuplicateInstanceNotice();
    else if (!APP_DUPLICATE_INSTANCE) localStorage.setItem(APP_LOCK_KEY, JSON.stringify({ id:APP_INSTANCE_ID, time:Date.now() }));
  }, 3000);
  window.addEventListener('beforeunload', () => {
    const currentLock = JSON.parse(localStorage.getItem(APP_LOCK_KEY) || 'null');
    if (currentLock && currentLock.id === APP_INSTANCE_ID) localStorage.removeItem(APP_LOCK_KEY);
  });
} catch(e) { /* local file storage may be disabled */ }
if ('BroadcastChannel' in window) {
 try {
  const appChannel = new BroadcastChannel('checkin-app-single-instance');
  appChannel.onmessage = e => {
    if (e.data && e.data.type === 'hello' && !APP_DUPLICATE_INSTANCE) {
      if (APP_INSTANCE_ID < e.data.id) appChannel.postMessage({ type:'active', id:e.data.id });
      else showDuplicateInstanceNotice();
    }
    if (e.data && e.data.type === 'active' && e.data.id === APP_INSTANCE_ID) showDuplicateInstanceNotice();
  };
  setTimeout(() => appChannel.postMessage({ type:'hello', id:APP_INSTANCE_ID }), 80);
 } catch (e) { /* 某些本地文件预览会限制跨标签通信 */ }
}
const COLORS = 8;
const KEY_WEEK = 'checkin_weeks_v6';
const KEY_DAY  = 'checkin_days_v6';
const KEY_TT   = 'checkin_timetable_v1';
const KEY_BILL = 'checkin_bills_v1';    // 记账
const KEY_PWD  = 'checkin_pwds_v1';     // 密码记录
const KEY_FIXED = 'checkin_fixed_v1';   // 月固定支出
const KEY_FIXED_IN = 'checkin_fixed_in_v1'; // 月固定收入
const KEY_NOTE = 'checkin_notes_v1'; // 小纸条

// 将任务文本渲染为 HTML：转义特殊字符 + 把换行符转成 <br>
function textToHTML(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
    .replace(/\r\n/g, '\n').replace(/\r/g, '\n')
    .replace(/\n/g, '<br>');
}

const memStore = {};
let storageOK = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }
catch(e) { storageOK = false; }
if (!storageOK) {
  window.addEventListener('DOMContentLoaded', () => {
    const tip = document.createElement('div');
    tip.style.cssText = 'max-width:520px;margin:0 auto 12px;padding:10px 14px;background:#fff7e6;border:1px solid #f5c518;border-radius:12px;font-size:13px;color:#8a6d1a;line-height:1.6;';
    tip.textContent = '⚠️ 当前预览环境不支持永久保存，数据仅本次有效。请下载后用浏览器直接打开即可长期保存。';
    document.querySelector('.app').prepend(tip);
  });
}
function load(k, f) {
  if (!storageOK) { try { return JSON.parse(memStore[k]) || f; } catch(e) { return f; } }
  try { return JSON.parse(localStorage.getItem(k)) || f; } catch(e) { return f; }
}
function save(k, d) {
  const s = JSON.stringify(d);
  if (!storageOK) { memStore[k] = s; return; }
  try { localStorage.setItem(k, s); } catch(e) { memStore[k] = s; }
}

// 通用页内编辑栏：直接插入到被编辑记录之后，不弹出模态窗口。
let activeInlineEditor = null;
let activeInlineAnchor = null;
let activeInlineAnchorHTML = null;
let activeInlineReposition = null;
let inlineEditorOpeningAnchor = null;
function dismissInlineEditor() {
  if (activeInlineReposition) {
    window.removeEventListener('scroll', activeInlineReposition, true);
    window.removeEventListener('resize', activeInlineReposition);
    activeInlineReposition = null;
  }
  if (activeInlineEditor) activeInlineEditor.remove();
  document.body.classList.remove('inline-editing');
  if (activeInlineAnchor && activeInlineAnchorHTML !== null && activeInlineAnchor.matches('.cal-add,.bill-add,.pwd-add,.checkin-add-btn')) activeInlineAnchor.innerHTML = activeInlineAnchorHTML;
  activeInlineEditor = null; activeInlineAnchor = null; activeInlineAnchorHTML = null;
}
document.addEventListener('click', e => {
  const inForm = e.target.closest('.inline-editor,.inline-add-form,.pwd-add-fields');
  if (!inForm && !activeInlineEditor) document.body.classList.remove('inline-editing');
  if (!activeInlineEditor || activeInlineEditor.contains(e.target)) return;
  if (inlineEditorOpeningAnchor && (e.target === inlineEditorOpeningAnchor || inlineEditorOpeningAnchor.contains(e.target))) return;
  dismissInlineEditor();
});
document.addEventListener('focusin', e => {
  if (e.target.closest('.inline-editor,.inline-add-form,.pwd-add-fields')) document.body.classList.add('inline-editing');
});
function showInlineEditor(anchor, title, fields, onSave, onCancel, onDelete, placement) {
  if (activeInlineEditor && !activeInlineEditor.isConnected) {
    activeInlineEditor = null; activeInlineAnchor = null; activeInlineAnchorHTML = null;
    document.body.classList.remove('inline-editing');
  }
  if (activeInlineEditor && activeInlineAnchor === anchor) { dismissInlineEditor(); return null; }
  dismissInlineEditor();
  document.querySelectorAll('.inline-editor').forEach(x => x.remove());
  const tilePlacement = placement === 'below-tile' && anchor && anchor.classList.contains('tile');
  if (tilePlacement) anchor.scrollIntoView({ block:'center', inline:'nearest' });
  const editor = document.createElement('div');
  editor.className = 'inline-editor';
  const heading = document.createElement('div');
  heading.className = 'inline-editor-title'; heading.textContent = title;
  editor.appendChild(heading);
  const controls = [];

function pad(n) { return n < 10 ? '0' + n : '' + n; }

// ===== 布局与动画 =====
// 面板 4 列 × 6 行 = 24 格，代表一天 24 小时
// 任务块大小由计划时长决定：小时数 → 格子数（尽量排成接近方形的块）
//   未完成任务 → 从左上角逐格堆放
//   完成任务   → 从右下角逐格堆放
// 状态切换后保留任务块 DOM，并为所有受布局影响的块播放弹性移动。

const COLS = 8, ROWS = 12;
// 对所有因重新布局而移动的块播放轻微弹性位移动画。
function tileTransform(tx, ty, scale = 1) {
  return 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
}
function tilePosition(transform) {
  if (!transform || transform === 'none') return { x:0, y:0 };
  try {
    const m = new DOMMatrixReadOnly(transform);
    return { x:m.m41, y:m.m42 };
  } catch (_) {
    const m = String(transform).match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
    if (m) return { x:parseFloat(m[1]), y:parseFloat(m[2]) };
    const matrix = String(transform).match(/^matrix\(([^)]+)\)$/);
    if (matrix) { const values = matrix[1].split(',').map(Number); return { x:values[4] || 0, y:values[5] || 0 }; }
    return { x:0, y:0 };
  }
}
function animateTilePosition(el, fromTransform, tx, ty, isNew) {
  const target = tileTransform(tx, ty);
  const from = tilePosition(fromTransform);
  const dx = tx - from.x, dy = ty - from.y;
  const distance = Math.hypot(dx, dy);
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const animations = el.getAnimations ? el.getAnimations() : [];
  animations.forEach(a => a.cancel());
  if (reduceMotion || distance < 1) { el.style.transform = target; return; }

  const overshoot = Math.min(11, Math.max(2.5, distance * 0.035));
  const ox = tx + dx / distance * overshoot;
  const oy = ty + dy / distance * overshoot;
  const duration = Math.max(380, Math.min(820, 340 + distance * 0.38));
  el.style.transform = target;
  if (typeof el.animate !== 'function') return;
  const frames = isNew
    ? [{ transform:tileTransform(from.x, from.y, .94), opacity:.72, offset:0 }, { transform:tileTransform(ox, oy, 1.025), opacity:1, offset:.76 }, { transform:target, opacity:1, offset:1 }]
    : [{ transform:tileTransform(from.x, from.y), offset:0 }, { transform:tileTransform(ox, oy, 1.012), offset:.78 }, { transform:target, offset:1 }];
  const animation = el.animate(frames, { duration, easing:'cubic-bezier(.2,.72,.25,1)', fill:'both' });
  animation.onfinish = () => { el.style.transform = target; animation.cancel(); };
}

// 难度级别 = 占用的格子数，尽量排成接近正方形（优先正方形，其次宽扁，浪费最少）
function hoursToGrid(x) {
  const cells = Math.max(1, Math.round(x));
  const cands = [];
  for (let c = 1; c <= COLS; c++) {
    const r = Math.ceil(cells / c);
    if (r <= ROWS) cands.push({ c, r, waste: c * r - cells });
  }
  if (!cands.length) return { c: COLS, r: ROWS };
  // 排序：浪费最少 → 越接近正方形（|c-r| 越小）→ 更宽
  cands.sort((a, b) => a.waste - b.waste || Math.abs(a.c - a.r) - Math.abs(b.c - b.r) || b.c - a.c);
  return { c: cands[0].c, r: cands[0].r };
}

// ===== 排序优先级：有时间戳按时间排序；无时间戳按浮沉状态自然布局 =====
// 任务字段：
//   start: string，开始时间戳（有时间戳的任务按时间排序，优先）
function timeVal(t) {
  if (!t.start) return Infinity;
  const m = String(t.start).match(/(\d{1,2}):(\d{2})/);
  if (!m) return Infinity;
  return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}
// 有有效时间的排在同一浮沉分组前面并按时间排序；无时间的保持原顺序，交由浮沉布局排列。
function cmpSeq(a, b) {
  const at = timeVal(a), bt = timeVal(b);
  const ah = Number.isFinite(at), bh = Number.isFinite(bt);
  if (ah !== bh) return ah ? -1 : 1;
  return ah ? at - bt : 0;
}

function render(scope) {
  const board = document.getElementById(scope + 'Board');
  const { tasks } = getData(scope);
  let hint = board.querySelector('.board-hint');
  if (!hint) { hint = document.createElement('div'); hint.className = 'board-hint'; board.appendChild(hint); }
  hint.textContent = '长按空白处添加任务';

  const bw = board.clientWidth || board.offsetWidth || 400;
  const bh = board.clientHeight || board.offsetHeight || 600;
  const GAP = 6;
  const cellW = (bw - GAP * (COLS + 1)) / COLS;
  const cellH = (bh - GAP * (ROWS + 1)) / ROWS;

  // 计算每个块的尺寸（像素）与占格
  const tiles = tasks.map(t => {
    const { c, r } = hoursToGrid(t.hours != null ? t.hours : 2);
    const pw = c * cellW + (c - 1) * GAP;
    const ph = r * cellH + (r - 1) * GAP;
    return { t, pw, ph, c, r, tx: 0, ty: 0 };
  });

  // 按浮沉状态与时间顺序自动布局，不保留手动拖拽位置。
  const occ = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  function fits(c0, r0, c, r) {
    if (c0 < 0 || r0 < 0 || c0 + c > COLS || r0 + r > ROWS) return false;
    for (let rr = r0; rr < r0 + r; rr++)
      for (let cc = c0; cc < c0 + c; cc++)
        if (occ[rr][cc]) return false;
    return true;
  }
  function mark(u, c0, r0) {
    for (let rr = r0; rr < r0 + u.r; rr++)
      for (let cc = c0; cc < c0 + u.c; cc++) occ[rr][cc] = true;
    u.gx = c0; u.gy = r0;
  }
  function scanFind(u) {
    for (let r0 = 0; r0 <= ROWS - u.r; r0++)
      for (let c0 = 0; c0 <= COLS - u.c; c0++)
        if (fits(c0, r0, u.c, u.r)) return [c0, r0];
    return null;
  }

  const bySeq = (a, b) => cmpSeq(a.t, b.t);
  const undone = tiles.filter(x => !x.t.done).sort(bySeq);
  const done = tiles.filter(x => x.t.done).sort(bySeq);

  // 未完成块从左上角向右下浮起。
  for (const u of undone) {
    const pos = scanFind(u);
    if (pos) mark(u, pos[0], pos[1]);
  }

  // 完成块：从右下角逐格扫描沉底（镜像：向上向左填）
  const doneLeft = done.filter(x => x.gx == null);
  for (const d of doneLeft) {
    placed2: for (let r0 = ROWS - d.r; r0 >= 0; r0--) {
      for (let c0 = COLS - d.c; c0 >= 0; c0--) {
        if (fits(c0, r0, d.c, d.r)) {
          mark(d, c0, r0);
          break placed2;
        }
      }
    }
  }

  for (const u of tiles) {
    if (u.gx == null) continue;
    u.tx = GAP + u.gx * (cellW + GAP);
    u.ty = GAP + u.gy * (cellH + GAP);
  }

  // 根据块尺寸自动计算字体大小：块越小字越小（描述细体，字号偏小）
  function fitStyle(pw, ph, hasTime) {
    const s = Math.min(pw, ph);
    let fs;                                    // 任务文字字号
    if (s < 46) fs = 8;
    else if (s < 62) fs = 9.5;
    else if (s < 90) fs = 11;
    else fs = 12;
    const tfs = s < 46 ? 8 : 9;                // 时间签字号
    return { fs, tfs };
  }

  // 创建/更新 DOM
  tiles.forEach(({ t, pw, ph, tx, ty }) => {
    let el = board.querySelector('[data-id="' + t.id + '"]');
    const isNew = !el;
    const fromTransform = isNew ? '' : getComputedStyle(el).transform;
    const fit = fitStyle(pw, ph, !!t.start);
    if (isNew) {
      el = document.createElement('div');
      el.dataset.id = t.id;
      el.className = 'tile c' + (t.color % COLORS) + (t.done ? ' done' : ' balloon') + (t.start ? ' has-time' : '');
      if (t.start) {
        const tm = document.createElement('div');
        tm.className = 'tile-time'; tm.textContent = t.start;
        tm.style.fontSize = fit.tfs + 'px';
        el.appendChild(tm);
      }
      const span = document.createElement('span');
      span.className = 'tile-text';
      span.innerHTML = textToHTML(t.text);
      el.appendChild(span);
      const check = document.createElement('div');
      check.className = 'tile-check'; check.textContent = '✓'; el.appendChild(check);
      // 新块从面板中央出现
      el.style.width = pw + 'px';
      el.style.height = ph + 'px';
      el.style.fontSize = fit.fs + 'px';
      el.style.transform = tileTransform(bw/2 - pw/2, bh/2 - ph/2);
      board.appendChild(el);
      bindTileEvents(el, scope, t);
    } else {
      el.className = 'tile c' + (t.color % COLORS) + (t.done ? ' done' : ' balloon');
      el.classList.toggle('has-time', !!t.start);
      el.style.width = pw + 'px';
      el.style.height = ph + 'px';
      el.style.fontSize = fit.fs + 'px';
      const span = el.querySelector('.tile-text');
      span.innerHTML = textToHTML(t.text);
      // 时间标签：有则更新/创建，无则移除
      let tm = el.querySelector('.tile-time');
      if (t.start) {
        if (!tm) { tm = document.createElement('div'); tm.className = 'tile-time'; el.insertBefore(tm, el.querySelector('.tile-text')); }
        tm.textContent = t.start;
        tm.style.fontSize = fit.tfs + 'px';
      } else if (tm) { tm.remove(); }
    }
    animateTilePosition(el, isNew ? el.style.transform : fromTransform, tx, ty, isNew);
  });

  // 移除已删除的块
  board.querySelectorAll('.tile').forEach(el => {
    if (!tasks.find(t => String(t.id) === el.dataset.id)) el.remove();
  });

  bindBoardEvents(board, scope);
}

// ===== 交互绑定 =====
function bindTileEvents(el, scope, t) {
  el.oncontextmenu = (e) => e.preventDefault();
  let timer = null, longFired = false;
  function start(e) {
    if (e.button != null && e.button !== 0) return;
    longFired = false;
    clearTimeout(timer);
    timer = setTimeout(() => { longFired = true; openTileMenu(scope, t, el); }, 400);
  }
  function end() {
    clearTimeout(timer);
  }

  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
  el.addEventListener('click', (e) => {
    if (longFired) { e.preventDefault(); e.stopPropagation(); longFired = false; return; }
    toggleTile(scope, t.id);
  });
}

function bindBoardEvents(board, scope) {
  board.oncontextmenu = (e) => e.preventDefault();
  let boardTimer = null;
  function boardDown(e) {
    if (e.target !== board && !e.target.classList.contains('board-hint')) return;
    board.classList.add('pressing');
    boardTimer = setTimeout(() => { board.classList.remove('pressing'); openDialog(scope); }, 400);
  }
  function boardUp() { board.classList.remove('pressing'); clearTimeout(boardTimer); }
  board.addEventListener('touchstart', boardDown, { passive: true });
  board.addEventListener('mousedown', boardDown);
  board.addEventListener('touchend', boardUp);
  board.addEventListener('touchmove', boardUp, { passive: true });
  board.addEventListener('mouseup', boardUp);
  board.addEventListener('mouseleave', boardUp);
}

function toggleTile(scope, id) {
  const { tasks } = getData(scope);
  const t = tasks.find(x => x.id === id);
  if (t) t.done = !t.done;
  setData(scope, tasks);
  render(scope);  // 重新渲染，物理会让它飞向新区域
}

function bindTimeInputs() {
  const hourEl = document.getElementById('tpHour');
  const minEl = document.getElementById('tpMinute');
  ['calAddHour','calAddMinute'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', () => { el.value = el.value.replace(/\D/g, '').slice(0, 2); });
  });
  function numericOnly(el, max) {
    el.addEventListener('input', () => {
      // 去除非数字字符
      let v = el.value.replace(/\D/g, '');
      // 小时/分钟都最多 2 位
      if (v.length > 2) v = v.slice(0, 2);
      el.value = v;
    });
    el.addEventListener('blur', () => {
      let v = el.value.replace(/\D/g, '');
      if (v === '') { el.value = ''; return; }
      let n = parseInt(v, 10);
      if (n <= max) el.value = String(n).padStart(2, '0');
    });
    // 阻止非数字按键（保留退格/删除/方向键/Tab）
    el.addEventListener('keydown', (e) => {
      const ok = ['Backspace','Delete','ArrowLeft','ArrowRight','Tab','Home','End','Enter'];
      if (ok.includes(e.key) || e.ctrlKey || e.metaKey) return;
      if (!/\d/.test(e.key)) e.preventDefault();
    });
  }
  numericOnly(hourEl, 23);
  numericOnly(minEl, 59);
}

// ===== 通用输入弹窗（替代沙箱禁用的 prompt） =====
// 支持多行：Enter 换行，Ctrl/Cmd+Enter 提交
function askInput(title, placeholder, initial) {
  return new Promise((resolve) => {
    document.getElementById('promptTitle').textContent = title;
    const inp = document.getElementById('promptInput');
    inp.placeholder = placeholder || '';
    inp.value = initial != null ? initial : '';
    document.getElementById('promptOverlay').classList.add('show');
    inp.focus();
    function done(val) {
      document.getElementById('promptOverlay').classList.remove('show');
      cleanup();
      resolve(val);
    }
    function onOk() { done(inp.value); }
    function onCancel() { done(null); }
    function onKey(e) {
      if (e.key === 'Enter') {
        if (e.ctrlKey || e.metaKey) { e.preventDefault(); onOk(); }
        // 普通 Enter：多行模式下允许换行，不提交
      }
    }
    function cleanup() {
      document.getElementById('promptOk').removeEventListener('click', onOk);
      document.getElementById('promptCancel').removeEventListener('click', onCancel);
      document.getElementById('promptOverlay').removeEventListener('click', onBackdrop);
      inp.removeEventListener('keydown', onKey);
    }
    function onBackdrop(e) { if (e.target === e.currentTarget) onCancel(); }
    document.getElementById('promptOk').addEventListener('click', onOk);
    document.getElementById('promptCancel').addEventListener('click', onCancel);
    document.getElementById('promptOverlay').addEventListener('click', onBackdrop);
    inp.addEventListener('keydown', onKey);
  });
}

// 返回字段值数组；取消返回 null
function openForm(title, fields, okText) {
  return new Promise((resolve) => {
    document.getElementById('formTitle').textContent = title;
    const wrap = document.getElementById('formFields');
    wrap.innerHTML = '';
    const inputs = [];
    fields.forEach(f => {
      const box = document.createElement('div');
      box.className = 'form-field';
      const lab = document.createElement('div');
      lab.className = 'form-label'; lab.textContent = f.label;
      let inp;
      if (f.type === 'textarea') {
        inp = document.createElement('textarea');
        inp.rows = 2;
      } else {
        inp = document.createElement('input');
        inp.type = f.type || 'text';
      }
      inp.placeholder = f.placeholder || '';
      inp.value = f.value != null ? f.value : '';
      box.appendChild(lab); box.appendChild(inp);
      wrap.appendChild(box);
      inputs.push(inp);
    });
    const okBtn = document.getElementById('formOk');
    if (okText) okBtn.textContent = okText; else okBtn.textContent = '确定';
    document.getElementById('formOverlay').classList.add('show');
    if (inputs[0]) inputs[0].focus();

    function cleanup() {
      document.getElementById('formOk').removeEventListener('click', onOk);
      document.getElementById('formCancel').removeEventListener('click', onCancel);
      document.getElementById('formOverlay').removeEventListener('click', onBackdrop);
    }
    function close(vals) {
      document.getElementById('formOverlay').classList.remove('show');
      cleanup();
      resolve(vals);
    }
    function onOk() { close(inputs.map(i => i.value)); }
    function onCancel() { close(null); }
    function onBackdrop(e) { if (e.target === e.currentTarget) onCancel(); }
    document.getElementById('formOk').addEventListener('click', onOk);
    document.getElementById('formCancel').addEventListener('click', onCancel);
    document.getElementById('formOverlay').addEventListener('click', onBackdrop);
  });
}

function calDateKey(y, m, d) {
  return y + '-' + pad(m + 1) + '-' + pad(d);

const CN_LUNAR = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { month: 'long', day: 'numeric' });
const CN_SOLAR_TERMS = ['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
const CN_SOLAR_TERM_MINUTES = [0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,263343,285989,308563,331033,353350,375494,397447,419210,440795,462224,483532,504758];
function calSolarTerm(y, m, d) {
  for (let i = 0; i < CN_SOLAR_TERMS.length; i++) {
    const utc = Date.UTC(1900, 0, 6, 2, 5) + 31556925974.7 * (y - 1900) + CN_SOLAR_TERM_MINUTES[i] * 60000;
    const dt = new Date(utc);
    if (dt.getFullYear() === y && dt.getMonth() === m && dt.getDate() === d) return CN_SOLAR_TERMS[i];
  }
  return '';
}
function calDayNote(y, m, d) {
  const date = new Date(y, m, d, 12);
  const parts = CN_LUNAR.formatToParts(date);
  const lunarMonth = (parts.find(x => x.type === 'month') || {}).value || '';
  const lunarDay = (parts.find(x => x.type === 'day') || {}).value || '';
  const chineseNumber = value => {
    const chars = {零:0,〇:0,一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
    const s = String(value).replace(/[初十廿卅]/g, ch => ({初:'',十:'十',廿:'二十',卅:'三十'}[ch]));
    if (/^\d+$/.test(s)) return Number(s);
    if (s === '十') return 10;
    let total = 0, digit = 0;
    for (const ch of s) { if (ch === '十') { total += (digit || 1) * 10; digit = 0; } else if (chars[ch] !== undefined) digit = chars[ch]; }
    return total + digit;
  };
  const lunarNum = chineseNumber(lunarDay);
  const solarTerm = calSolarTerm(y, m, d);
  const solarFestivals = { '1-1':'元旦', '2-14':'情人节', '3-8':'妇女节', '4-1':'愚人节', '5-1':'劳动节', '6-1':'儿童节', '7-1':'建党节', '8-1':'建军节', '9-10':'教师节', '10-1':'国庆节', '12-24':'平安夜', '12-25':'圣诞节' };
  const lunarFestivals = { '1-1':'春节', '1-15':'元宵', '5-5':'端午', '7-7':'七夕', '7-15':'中元', '8-15':'中秋', '9-9':'重阳', '12-8':'腊八', '12-23':'小年' };
  const lunarMonthNum = chineseNumber(lunarMonth.replace(/^闰/, '').replace(/月$/, ''));
  const tomorrowParts = CN_LUNAR.formatToParts(new Date(y, m, d + 1, 12));
  const tomorrowMonth = (tomorrowParts.find(x => x.type === 'month') || {}).value || '';
  const tomorrowDay = (tomorrowParts.find(x => x.type === 'day') || {}).value || '';
  const isLunarEve = lunarMonthNum === 12 && chineseNumber(tomorrowMonth.replace(/^闰/, '').replace(/月$/, '')) === 1 && chineseNumber(tomorrowDay) === 1;
  const special = solarTerm || solarFestivals[(m + 1) + '-' + d] || lunarFestivals[lunarMonthNum + '-' + lunarNum] || (isLunarEve ? '除夕' : '');
  return { text: special || lunarDay || lunarMonth, special: !!special };
}
function renderCalendar() {
  document.getElementById('calTitle').textContent = calYear + ' 年 ' + (calMonth + 1) + ' 月';
  const grid = document.getElementById('calGrid');

function bindLongPress(el, onLongPress) {
  el.oncontextmenu = (e) => e.preventDefault();
  let timer = null;
  let sx = 0, sy = 0;
  function down(e) {
    if (e.button != null && e.button !== 0) return;
    lpFired = false;
    const p = e.touches ? e.touches[0] : e;
    sx = p.clientX; sy = p.clientY;
    timer = setTimeout(() => { lpFired = true; onLongPress(); }, 400);
  }
  function move(e) {
    const p = e.touches ? e.touches[0] : e;
    if (Math.hypot(p.clientX - sx, p.clientY - sy) > 10) { clearTimeout(timer); }
  }
  function up() { clearTimeout(timer); }
  el.addEventListener('touchstart', down, { passive: true });
  el.addEventListener('touchmove', move, { passive: true });
  el.addEventListener('touchend', up);
  el.addEventListener('touchcancel', up);
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
}

    : '每月自动计入的固定进账（工资、零花钱等），会累加到月度明细与年账单';

function billToggleMonth(key) {
  if (billExpandedKey === key) {
    billExpandedKey = null;

  } else {
    billExpandedKey = key;
    billUnknownMode = key === 'unknown';

// 固定项（支出/收入）
function billFixedGetAll() { return load(KEY_FIXED, []); }
function billFixedSaveAll(list) { save(KEY_FIXED, list); }
function billFixedInGetAll() { return load(KEY_FIXED_IN, []); }
function billFixedInSaveAll(list) { save(KEY_FIXED_IN, list); }
function currentFixedList() { return billType === 'expense' ? billFixedGetAll() : billFixedInGetAll(); }

function renderBill() {
  if (!billMonthPanel) billMonthPanel = document.getElementById('billMonthView');
  const list = billGetAll();
  const fixedOut = billFixedGetAll();
  const fixedIn = billFixedInGetAll();
  const fixedOutTotal = fixedOut.reduce((s, f) => s + (f.amount || 0), 0);
  const fixedInTotal = fixedIn.reduce((s, f) => s + (f.amount || 0), 0);
  const isExpense = billType === 'expense';
  const TYPE = isExpense ? 'expense' : 'income';

  // ===== 月度明细 =====
  let monthList;
  if (billUnknownMode) {
    // 未知月份：dateKey 为空的记录
    monthList = list.filter(b => (!b.dateKey) && b.type === TYPE);
    document.getElementById('billMonthTitle').textContent = '其他日期';
  } else {
    const monthPrefix = billYear + '-' + pad(billMonth + 1);
    monthList = list.filter(b => b.dateKey && b.dateKey.startsWith(monthPrefix) && b.type === TYPE);
    document.getElementById('billMonthTitle').textContent = billYear + ' 年 ' + (billMonth + 1) + ' 月';
  }
  const monthFixed = billUnknownMode ? 0 : (isExpense ? fixedOutTotal : fixedInTotal);
  const monthTotal = monthList.reduce((s, b) => s + b.amount, 0) + monthFixed;
  document.getElementById('billMonthSummary').innerHTML =
    '<span class="hs-amt ' + TYPE + '">' + fmtMoney(monthTotal) + '</span>' +
    '<span class="hs-sub">' + monthList.length + ' 笔</span>';
  const mRows = document.getElementById('billMonthRows');
  mRows.innerHTML = '';
  // 固定项汇总行（置顶；未知模式无固定）
  const curFixed = currentFixedList();
  const hasAnyMonth = monthList.length || (!billUnknownMode && curFixed.length);
  if (!hasAnyMonth) {
    const e = document.createElement('div');
    e.className = 'bill-empty';
    e.textContent = billUnknownMode
      ? (isExpense ? '还没有其他日期的支出记录' : '还没有其他日期的收入记录')
      : (isExpense ? '本月还没有支出，可在上方添加' : '本月还没有收入，可在上方添加');
    mRows.appendChild(e);
  } else {
    if (!billUnknownMode && curFixed.length) {
      const fRow = document.createElement('div');
      fRow.className = 'bill-row fixed-row';
      const fName = document.createElement('div');
      fName.className = 'br-name';
      fName.textContent = isExpense ? '月固定支出' : '月固定收入';
      const fSub = document.createElement('span');
      fSub.className = 'br-sub'; fSub.textContent = curFixed.map(x => x.name).join('、');
      fName.appendChild(fSub);
      const fAmt = document.createElement('div');
      fAmt.className = 'br-amt ' + TYPE; fAmt.textContent = (isExpense ? '-' : '+') + fmtMoney(monthFixed);
      fRow.appendChild(fName); fRow.appendChild(fAmt);
      fRow.addEventListener('click', () => switchBillTab('fixed'));
      mRows.appendChild(fRow);
    }
    monthList.slice().sort((a, b) => (b.dateKey || '').localeCompare(a.dateKey || '')).forEach(b => {
      const row = document.createElement('div');
      row.className = 'bill-row';
      const name = document.createElement('div');
      name.className = 'br-name';
      name.textContent = b.text || (isExpense ? '支出' : '收入');
      if (b.note) {
        const sub = document.createElement('span');
        sub.className = 'br-sub'; sub.textContent = b.note;
        name.appendChild(sub);
      }
      const amt = document.createElement('div');
      amt.className = 'br-amt ' + b.type;
      amt.textContent = (b.type === 'income' ? '+' : '-') + fmtMoney(b.amount);
      const del = document.createElement('button');
      del.className = 'br-del'; del.textContent = '×';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        billSaveAll(billGetAll().filter(x => x.id !== b.id)); renderBill();
      });
      row.appendChild(name); row.appendChild(amt); row.appendChild(del);
      row.classList.add('bill-editable');
      row.addEventListener('click', () => billStartEdit(b, row));
      mRows.appendChild(row);
    });
  }

  // ===== 年账单 =====
  document.getElementById('billYearTitle').textContent = billYear + ' 年';
  const yearPrefix = String(billYear);
  const yearList = list.filter(b => b.dateKey && b.dateKey.startsWith(yearPrefix) && b.type === TYPE);
  // 未知日期记录（dateKey 为空）
  const unknownList = list.filter(b => (!b.dateKey) && b.type === TYPE);
  const unknownTotal = unknownList.reduce((s, b) => s + b.amount, 0);
  const yearFixed = (isExpense ? fixedOutTotal : fixedInTotal) * 12;
  const yearTotal = yearList.reduce((s, b) => s + b.amount, 0) + unknownTotal + yearFixed;
  document.getElementById('billYearSummary').innerHTML =
    '<span class="hs-amt ' + TYPE + '">' + fmtMoney(yearTotal) + '</span>' +
    '<span class="hs-sub">' + (yearList.length + unknownList.length) + ' 笔</span>';
  const yRows = document.getElementById('billYearRows');
  yRows.innerHTML = '';
  // 未知日期行
  let expandedRow = null;
  {
    const row = document.createElement('div');
    row.className = 'bill-row month-row' + (billExpandedKey === 'unknown' ? ' expanded' : '');
    const name = document.createElement('div');
    name.className = 'br-name'; name.textContent = '其他';
    if (unknownTotal > 0) {
      const sub = document.createElement('span');
      sub.className = 'br-sub'; sub.textContent = fmtMoney(unknownTotal) + '（' + unknownList.length + ' 笔）';
      name.appendChild(sub);
    }
    const amt = document.createElement('div');
    amt.className = 'br-amt ' + TYPE;
    amt.textContent = unknownTotal > 0 ? fmtMoney(unknownTotal) : '—';
    row.appendChild(name); row.appendChild(amt);
    row.addEventListener('click', () => billToggleMonth('unknown'));
    if (billExpandedKey === 'unknown') expandedRow = row;
    yRows.appendChild(row);
  }
  // 每月合计：1月~12月
  const byMonth = Array.from({ length: 12 }, () => 0);
  yearList.forEach(b => {
    const m = parseInt(String(b.dateKey).slice(5, 7), 10) - 1;
    if (m >= 0 && m < 12) byMonth[m] += b.amount;
  });
  const monthFixedEach = isExpense ? fixedOutTotal : fixedInTotal;
  for (let m = 0; m < 12; m++) {
    const total = byMonth[m] + monthFixedEach;
    const row = document.createElement('div');
    row.className = 'bill-row month-row' + (billExpandedKey === m ? ' expanded' : '');
    const name = document.createElement('div');
    name.className = 'br-name'; name.textContent = (m + 1) + '月';
    if (monthFixedEach > 0) {
      const sub = document.createElement('span');
      sub.className = 'br-sub';
      sub.textContent = '（含固定 ' + fmtMoney(monthFixedEach) + '）';
      name.appendChild(sub);
    }
    const amt = document.createElement('div');
    amt.className = 'br-amt ' + TYPE;
    amt.textContent = total > 0 ? fmtMoney(total) : '—';
    row.appendChild(name); row.appendChild(amt);
    row.addEventListener('click', () => billToggleMonth(m));
    if (billExpandedKey === m) expandedRow = row;
    yRows.appendChild(row);
  }

  const monthView = billMonthPanel;
  const monthPlaceholder = document.getElementById('billMonthPlaceholder');
  if (billTab === 'year' && expandedRow) {
    expandedRow.after(monthView);
    monthView.classList.remove('hidden');
  } else {
    monthPlaceholder.appendChild(monthView);
    monthView.classList.add('hidden');
  }

  // ===== 固定（支出/收入跟随） =====
  renderBillFixed(curFixed);
}

function renderMine() {
  const weekAll = load(KEY_WEEK, {});
  const dayAll = load(KEY_DAY, {});
  let done = 0, undone = 0;
  const dayKeys = new Set();
  // 周任务
  for (const k in weekAll) {
    (weekAll[k] || []).forEach(t => { if (t.done) done++; else undone++; });
  }
  // 日任务
  for (const k in dayAll) {
    const arr = dayAll[k] || [];
    if (arr.length) dayKeys.add(k);
    arr.forEach(t => { if (t.done) done++; else undone++; });
  }
  document.getElementById('statDone').textContent = done;
  document.getElementById('statUndone').textContent = undone;
  document.getElementById('statDays').textContent = dayKeys.size;
}

async function exportData() {
  const data = { KEY_WEEK, KEY_DAY, KEY_TT, week: load(KEY_WEEK, {}), day: load(KEY_DAY, {}), tt: load(KEY_TT, {}), bill: load(KEY_BILL, []), pwd: load(KEY_PWD, []), fixed: load(KEY_FIXED, []), fixedIn: load(KEY_FIXED_IN, []), note: load(KEY_NOTE, []) };
  const contents = JSON.stringify(data, null, 2);
  const filename = '打卡数据_' + dateKey(new Date()) + '.json';
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description:'JSON 备份文件', accept:{ 'application/json':['.json'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(new Blob([contents], { type:'application/json' }));
      await writable.close();
      alert('备份已保存。');
      return;
    } catch (error) {
      if (error && error.name === 'AbortError') return;
      alert('无法打开文件保存窗口，将使用浏览器默认下载位置。');
    }
  }
  const blob = new Blob([contents], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const wk = data.week || data[KEY_WEEK] || {};
        const dy = data.day || data[KEY_DAY] || {};
        const tt = data.tt || data[KEY_TT] || {};
        const bi = data.bill || data[KEY_BILL] || [];
        const pw = data.pwd || data[KEY_PWD] || [];
        const fx = data.fixed || data[KEY_FIXED] || [];
        const fxi = data.fixedIn || data[KEY_FIXED_IN] || [];
        const nt = data.note || data[KEY_NOTE] || [];
        save(KEY_WEEK, wk);
        save(KEY_DAY, dy);
        save(KEY_TT, tt);
        save(KEY_BILL, bi);
        save(KEY_PWD, pw);
        save(KEY_FIXED, fx);
        save(KEY_FIXED_IN, fxi);
        save(KEY_NOTE, nt);
        renderMine();
      } catch(e) { alert('导入失败：文件格式不正确'); }
    };
    reader.readAsText(f);
  };
  inp.click();
}

function clearAllData() {
  if (!confirm('确定要清空所有打卡数据吗？此操作不可恢复！')) return;
  save(KEY_WEEK, {});
  save(KEY_DAY, {});
  save(KEY_TT, {});
  save(KEY_BILL, []);
  save(KEY_PWD, []);
  save(KEY_FIXED, []);
  save(KEY_FIXED_IN, []);
  save(KEY_NOTE, []);
  renderMine();
}

// ===== 周打卡·课程表模式 =====
// 课程表：一个整体大框，背景有纵横时间坐标（横轴 周一~周日，纵轴 上午/下午）作参照
// 任务块按「难度」决定大小（复用 hoursToGrid），全局布局：
//   未完成任务 → 浮到整个大框左上角；完成任务 → 沉到整个大框右下角
// 任务带 dayId(1-7)/partId(am|pm)，块上显示「周X·上午/下午」标签
// 数据：按周 key 存任务数组，任务对象含 text/hours/start/dayId/partId/done/color
const TT_DAYS = [
  { id: 1, label: '周一', short: '一' },
  { id: 2, label: '周二', short: '二' },
  { id: 3, label: '周三', short: '三' },
  { id: 4, label: '周四', short: '四' },
  { id: 5, label: '周五', short: '五' },
  { id: 6, label: '周六', short: '六' },
  { id: 7, label: '周日', short: '日' }
];
// 大框网格：7 列(周一~周日) × 18 行；任务块宽=整列宽(1列)，高=1行
const TT_COLS = 7, TT_ROWS = 18;
const TT_TILE_COLS = 1, TT_TILE_ROWS = 1; // 每块占 1 列宽 × 1 行高

function ttGetWeekTasks() {
  const all = load(KEY_TT, {});
  const wk = weekKey(currentWeekStart);
  return { wk, tasks: all[wk] || [] };
}
function ttSetWeekTasks(tasks) {
  const all = load(KEY_TT, {});
  const wk = weekKey(currentWeekStart);
  all[wk] = tasks;
  save(KEY_TT, all);
}

function switchWeekView(view) {
  weekView = view;
  document.querySelectorAll('#weekTabs .vt-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  document.getElementById('weekBoardWrap').classList.toggle('hidden', view !== 'board');
  document.getElementById('weekTableWrap').classList.toggle('hidden', view !== 'timetable');
  if (view === 'board') render('week');
  else renderTimetable();
}

// 时间戳 HH:MM → 「8点」/「9点30」格式
function ttPoint(start) {
  const m = String(start || '').match(/(\d{1,2}):(\d{2})/);
  if (!m) return '';
  const h = parseInt(m[1], 10), mm = m[2];
  return h + '点' + (mm !== '00' ? mm : '');
}

// 列表模式：按星期分组的纯文字清单
// 格式：- 周一：任务A（8点，11点）；任务B（10点）
// 同一天同名任务合并，时间点依次列出；无浮沉、无网格
function renderTimetable() {
  const wrap = document.getElementById('weekTableWrap');
  wrap.innerHTML = '';

  const today = new Date();
  const dow = today.getDay();
  const todayId = dow === 0 ? 7 : dow;
  const { tasks } = ttGetWeekTasks();

  const list = document.createElement('div');
  list.className = 'tt-list';

  let any = false;
  TT_DAYS.forEach(d => {
    const dayTasks = tasks.filter(t => (t.dayId || 1) === d.id).sort(cmpSeq);
    if (!dayTasks.length) return;
    any = true;

    // 同名任务合并，时间点依次列出
    const groups = [];
    const map = {};
    for (const t of dayTasks) {
      const k = String(t.text);
      if (!map[k]) { map[k] = { text: t.text, times: [], members: [] }; groups.push(map[k]); }
      const pt = ttPoint(t.start);
      if (pt) map[k].times.push(pt);
      map[k].members.push(t);
    }

    const row = document.createElement('div');
    row.className = 'tt-row';
    const head = document.createElement('span');
    head.className = 'tt-row-day';
    head.textContent = d.label + '：';
    row.appendChild(head);

    groups.forEach((g, gi) => {
      if (gi) {
        const sep = document.createElement('span');
        sep.className = 'tt-row-sep'; sep.textContent = '；';
        row.appendChild(sep);
      }
      const item = document.createElement('button');
      item.type = 'button';
      item.setAttribute('role', 'checkbox');
      const allDone = g.members.every(m => m.done);
      const someDone = g.members.some(m => m.done);
      item.className = 'tt-item' + (allDone ? ' done' : (someDone ? ' part' : ''));
      item.setAttribute('aria-checked', allDone ? 'true' : (someDone ? 'mixed' : 'false'));
      item.setAttribute('aria-label', g.text + (g.times.length ? '，' + g.times.join('，') : ''));
      const check = document.createElement('span');
      check.className = 'tt-check'; check.setAttribute('aria-hidden', 'true');
      const label = document.createElement('span');
      label.className = 'tt-label'; label.textContent = g.text + (g.times.length ? '（' + g.times.join('，') + '）' : '');
      item.append(check, label);
      // 点击：切换该组全部任务的完成状态
      item.addEventListener('click', () => {
        const { tasks: ts } = ttGetWeekTasks();
        const ids = new Set(g.members.map(m => String(m.id)));
        const objs = ts.filter(x => ids.has(String(x.id)));
        const wasAllDone = objs.every(o => o.done);
        objs.forEach(o => { o.done = !wasAllDone; });
        ttSetWeekTasks(ts);
        renderTimetable();
      });
      bindTTItemEvents(item, g);
      row.appendChild(item);
    });
    list.appendChild(row);
  });

  if (!any) {
    const hint = document.createElement('div');
    hint.className = 'tt-list-hint';
    hint.textContent = '长按空白处添加任务';
    list.appendChild(hint);
  }
  wrap.appendChild(list);
  bindTTListAdd(list);
}

// 列表条目：长按弹菜单（编辑名称/时间戳/删除），作用于该组第一个任务
let ttItemLongFired = false; // 长按标记（全局唯一，长按后抑制紧随的 click 误触）
function bindTTItemEvents(item, group) {
  item.oncontextmenu = (e) => e.preventDefault();
  let timer = null;
  let sx = 0, sy = 0;
  const rep = group.members[0];
  function down(e) {
    if (e.button != null && e.button !== 0) return;
    ttItemLongFired = false;
    const p = e.touches ? e.touches[0] : e;
    sx = p.clientX; sy = p.clientY;
    timer = setTimeout(() => { ttItemLongFired = true; openTTTileMenu(rep, item); }, 400);
  }
  function move(e) {
    const p = e.touches ? e.touches[0] : e;
    if (Math.hypot(p.clientX - sx, p.clientY - sy) > 10) { clearTimeout(timer); }
  }
  function up() { clearTimeout(timer); }
  item.addEventListener('touchstart', down, { passive: true });
  item.addEventListener('touchmove', move, { passive: true });
  item.addEventListener('touchend', up);
  item.addEventListener('touchcancel', up);
  item.addEventListener('mousedown', down);
  item.addEventListener('mouseup', up);
  item.addEventListener('mouseleave', up);
}
// 长按菜单打开后，拦截紧随的 click（捕获阶段，只注册一次）
document.addEventListener('click', (e) => {
  if (ttItemLongFired) { e.preventDefault(); e.stopPropagation(); ttItemLongFired = false; }
}, true);

// 列表空白处（或空提示）长按添加任务
function bindTTListAdd(list) {
  list.oncontextmenu = (e) => e.preventDefault();
  let timer = null;
  function down(e) {
    if (e.target !== list && !e.target.classList.contains('tt-list-hint') && !e.target.classList.contains('tt-row')) return;
    list.classList.add('pressing');
    timer = setTimeout(() => { list.classList.remove('pressing'); openTTDialog(); }, 400);
  }
  function up() { list.classList.remove('pressing'); clearTimeout(timer); }
  list.addEventListener('touchstart', down, { passive: true });
  list.addEventListener('touchend', up);
  list.addEventListener('touchmove', up, { passive: true });
  list.addEventListener('mousedown', down);
  list.addEventListener('mouseup', up);
  list.addEventListener('mouseleave', up);
}

function openTTTileMenu(t, el) {
  const { tasks } = ttGetWeekTasks();
  const obj = tasks.find(x => x.id === t.id);
  if (!obj) return;
  const anchor = el.closest('.tt-row') || el;
  showInlineEditor(anchor, '编辑任务', [
    { label:'任务名称', value:obj.text || '' },
    ...makeTimeFields(obj.start)
  ], values => {
    const name = values[0].trim();
    const start = readTimeFields(values, 1);
    if (!name) { alert('请填写任务名称'); return false; }
    if (start === null) { alert('小时范围为 0–23，分钟范围为 0–59'); return false; }
    obj.text = name; obj.start = start;
    ttSetWeekTasks(tasks); renderTimetable();
  }, null, () => {
    ttSetWeekTasks(tasks.filter(x => x.id !== obj.id));
    renderTimetable();
  });
}

// 列表模式：时间戳在条目下方直接编辑
function openTTTimeEdit(t, el) {
  const anchor = el ? (el.closest('.tt-row') || el) : document.getElementById('weekTableWrap');
  showInlineEditor(anchor, '设置时间', makeTimeFields(t.start), values => {
    const start = readTimeFields(values, 0);
    if (start === null) { alert('小时范围为 0–23，分钟范围为 0–59'); return false; }
    const { tasks } = ttGetWeekTasks();
    const obj = tasks.find(x => x.id === t.id);
    if (obj) { obj.start = start; ttSetWeekTasks(tasks); renderTimetable(); }
  });
}
// 列表模式长按空白处后，在页面中填写任务
let ttDialogTarget = null;
let ttDialogDay = 1;
function openTTDialog() {
  const now = new Date();
  const dow = now.getDay();
  ttDialogDay = dow === 0 ? 7 : dow;
  ttDialogTarget = true;
  dialogScope = null;
  dismissInlineEditor();
  resetDialog();
  document.getElementById('dialogInput').value = '';
  document.getElementById('dialogTitle').textContent = '添加列表任务';
  document.getElementById('tpHour').value = '';
  document.getElementById('tpMinute').value = '';
  document.getElementById('durRow').style.display = 'none';
  document.getElementById('durLabel').style.display = 'none';
  renderTTSlotPicker();
  document.getElementById('overlay').classList.add('checkin-form', 'show');
  requestAnimationFrame(() => document.getElementById('dialogInput').focus());
}

// 在弹窗内渲染星期选择（复用 dur-row 样式，动态插入）
function renderTTSlotPicker() {
  const old = document.getElementById('ttSlotPicker');
  if (old) old.remove();

  const wrap = document.createElement('div');
  wrap.id = 'ttSlotPicker';

  const dl = document.createElement('div');
  dl.className = 'dur-label'; dl.textContent = '星期';
  wrap.appendChild(dl);
  const dayRow = document.createElement('div');
  dayRow.className = 'dur-row';
  TT_DAYS.forEach(d => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'dur-btn' + (d.id === ttDialogDay ? ' active' : '');
    b.textContent = d.short; b.dataset.day = d.id;
    b.addEventListener('click', () => { ttDialogDay = d.id; renderTTSlotPicker(); });
    dayRow.appendChild(b);
  });
  wrap.appendChild(dayRow);

  // 插入到难度选择之前（此时难度已隐藏，但位置固定）
  const durRow = document.getElementById('durRow');
  durRow.parentNode.insertBefore(wrap, durRow);
}

initTimePicker();
goPage('checkin');
